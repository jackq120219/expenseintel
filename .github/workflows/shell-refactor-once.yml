name: ExpenseIntel one-time shell refactor

on:
  push:
    paths:
      - 'scripts/shell-refactor-once.mjs'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize the shared shell
        run: node scripts/shell-refactor-once.mjs
      - name: Commit the refactor and remove one-time machinery
        run: |
          rm -f scripts/shell-refactor-once.mjs .github/workflows/shell-refactor-once.yml
          git config user.name "ExpenseIntel Refactor"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: unify ExpenseIntel navigation shell"
          git push
