name: ExpenseIntel JS syntax scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every repository JavaScript file
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f" >/tmp/jscheck.out 2>&1; then
              echo "FAILED: $f"
              cat /tmp/jscheck.out
              failed=1
            fi
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)
          exit $failed
