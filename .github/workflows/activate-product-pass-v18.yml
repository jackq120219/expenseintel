name: Activate ExpenseIntel product pass v18

on:
  push:
    paths:
      - '.github/workflows/activate-product-pass-v18.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load intake immediately on Check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('check/index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="/check/free-evidence-v15.css">'
          css2=css+'<link rel="stylesheet" href="/check/product-pass-v18.css">'
          if '/check/product-pass-v18.css' not in s:
              if css not in s: raise SystemExit('Check CSS anchor not found')
              s=s.replace(css,css2,1)
          anchor='<script src="/header-stability.js" defer></script>'
          if '/check/product-pass-v18.js' not in s:
              if anchor not in s: raise SystemExit('Check script anchor not found')
              s=s.replace(anchor,anchor+'<script src="/check/product-pass-v18.js" defer></script>',1)
          p.write_text(s)
          PY
          node --check check/product-pass-v18.js
          node --check check/sprint-bundle-v18.js
      - name: Commit activation
        run: |
          git config user.name "ExpenseIntel Product"
          git config user.email "actions@users.noreply.github.com"
          git add check/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "perf: load smart intake directly on Check"
          git push
