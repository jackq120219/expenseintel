<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Deep Check payment status — ExpenseIntel</title><link rel="stylesheet" href="/styles.css"><style>main{max-width:680px;padding:80px 24px;margin:auto;min-height:65vh}h1{font-size:clamp(36px,5vw,54px)}p{line-height:1.6}.badge{display:inline-block;background:#fff0cf;padding:8px 12px;color:#593c00;font-weight:bold;font-size:12px}.status{padding:22px;border:1px solid #292929;background:#fff;margin:22px 0}button{padding:12px 18px;cursor:pointer}</style></head><body><main><a href="/">ExpenseIntel</a><p class="badge">SANDBOX · NO REAL MONEY</p><h1>Deep Check payment status</h1><div class="status" id="status" role="status" aria-live="polite">Checking the payment directly with Stripe…</div><p>This is a test of the payment process only. A paid report is <strong>not yet generated or delivered</strong>. Do not enter real card details in the sandbox checkout.</p><button id="retry" type="button">Check again</button> <a href="/pricing/">Back to pricing</a></main><script>
(()=>{'use strict';const output=document.querySelector('#status');const id=new URLSearchParams(location.search).get('session_id');async function check(){if(!id||!/^cs_test_[a-zA-Z0-9_]+$/.test(id)){output.textContent='No valid test checkout reference. Return to the test checkout.';return}output.textContent='Checking the payment directly with Stripe…';try{const r=await fetch('/api/deep-check-status?session_id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error('Verification unavailable');output.textContent=d.state==='paid_awaiting_fulfillment'?'Test payment verified. Report delivery has not been activated.':d.state==='processing'?'Stripe reports a payment, but the order record is still processing. Try again shortly.':'No completed eligible test payment was found.'}catch(_e){output.textContent='Status is temporarily unavailable. Please try again.'}}document.querySelector('#retry').addEventListener('click',check);check()})();
</script></body></html>
